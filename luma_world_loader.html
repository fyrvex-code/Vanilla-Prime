<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#09070d" />
  <title>Luma World — Loading</title>

  <!-- Uses installed script fonts and a cursive fallback; no external libraries are required. -->

  <style>
    :root {
      color-scheme: dark;
      --pink: #ed83c8;
      --pink-light: #ffb2e3;
      --background: #09070d;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--background);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: system-ui, sans-serif;
    }

    /* Put the real website markup inside #site-content. The loader covers it until the page loads. */
    #site-content {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--background);
    }

    .splash {
      position: fixed;
      z-index: 99999;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(ellipse at 50% 54%, rgba(89, 35, 83, 0.16) 0%, rgba(31, 13, 31, 0.10) 32%, transparent 62%),
        radial-gradient(ellipse at 50% 50%, #100b14 0%, #09070d 66%, #07060a 100%);
      opacity: 1;
      transition: opacity 560ms ease;
    }

    .splash::before {
      content: "";
      position: absolute;
      z-index: -1;
      width: min(78vw, 760px);
      height: min(26vw, 230px);
      border-radius: 50%;
      background: rgba(215, 91, 176, 0.10);
      filter: blur(90px);
      opacity: 0.68;
      transform: translateY(5vh);
      animation: ambientGlow 2.2s ease-in-out both;
    }

    .wordmark-wrap {
      position: relative;
      width: max-content;
      max-width: 92vw;
      transform: translateY(5vh);
      isolation: isolate;
    }

    .wordmark {
      display: block;
      max-width: 92vw;
      color: var(--pink);
      white-space: nowrap;
      font-family: "Segoe Script", "Brush Script MT", "URW Chancery L", "Apple Chancery", cursive;
      font-size: clamp(66px, 15.5vw, 158px);
      font-weight: 400;
      line-height: 1.12;
      letter-spacing: -0.025em;
      text-align: center;
      opacity: 0;
      clip-path: inset(-18% 100% -18% 0);
      text-shadow:
        0 0 5px rgba(255, 151, 218, 0.95),
        0 0 16px rgba(239, 111, 195, 0.72),
        0 0 38px rgba(222, 89, 178, 0.38);
      animation: writeOn 1.42s cubic-bezier(.18,.72,.2,1) 180ms forwards;
      will-change: clip-path, opacity, filter;
    }

    /* A soft moving highlight gives the reveal a hand-written finishing point. */
    .wordmark-wrap::after {
      content: "";
      position: absolute;
      z-index: 2;
      top: 47%;
      left: 0;
      width: clamp(28px, 5vw, 58px);
      height: clamp(28px, 5vw, 58px);
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle, rgba(255, 214, 241, .94) 0%, rgba(247, 130, 207, .44) 28%, transparent 72%);
      filter: blur(5px);
      opacity: 0;
      animation: penGlow 1.42s cubic-bezier(.18,.72,.2,1) 180ms both;
    }

    .splash.is-leaving .wordmark {
      animation: blurAway 520ms ease forwards;
    }

    .splash.is-leaving .wordmark-wrap::after {
      animation: penFade 160ms ease forwards;
    }

    .splash.is-leaving {
      opacity: 0;
      pointer-events: none;
    }

    @keyframes writeOn {
      0% {
        opacity: 0;
        clip-path: inset(-18% 100% -18% 0);
        filter: blur(3px);
      }
      12% {
        opacity: 1;
        filter: blur(0);
      }
      100% {
        opacity: 1;
        clip-path: inset(-18% 0 -18% 0);
        filter: blur(0);
      }
    }

    @keyframes penGlow {
      0%   { left: 0%; opacity: 0; transform: translate(-50%, -50%) scale(.55); }
      9%   { opacity: .95; }
      88%  { opacity: .88; }
      100% { left: 100%; opacity: 0; transform: translate(-50%, -50%) scale(1.05); }
    }

    @keyframes blurAway {
      from { opacity: 1; filter: blur(0); transform: scale(1); }
      to   { opacity: 0; filter: blur(22px); transform: scale(1.035); }
    }

    @keyframes penFade {
      to { opacity: 0; }
    }

    @keyframes ambientGlow {
      0% { opacity: 0; transform: translateY(5vh) scale(.82); }
      45% { opacity: .72; }
      100% { opacity: .55; transform: translateY(5vh) scale(1); }
    }

    @media (max-width: 480px) {
      .wordmark-wrap { transform: translateY(4vh); }
      .wordmark { font-size: clamp(58px, 16vw, 82px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .wordmark {
        animation: none;
        opacity: 1;
        clip-path: none;
      }
      .wordmark-wrap::after,
      .splash::before { animation: none; opacity: 0; }
      .splash { transition-duration: 180ms; }
    }
  </style>
</head>
<body>
  <main id="site-content" aria-hidden="true">
    <!-- Replace this empty area with your website's actual page content. -->
  </main>

  <div class="splash" id="splash" role="status" aria-label="Luma World is loading">
    <div class="wordmark-wrap">
      <div class="wordmark">Luma World</div>
    </div>
  </div>

  <script>
    (() => {
      const splash = document.getElementById("splash");
      const siteContent = document.getElementById("site-content");
      if (!splash) return;

      const startedAt = performance.now();
      const minimumDisplayTime = 2200;
      const fadeDuration = 620;
      let dismissed = false;

      function dismissSplash() {
        if (dismissed) return;
        dismissed = true;

        const elapsed = performance.now() - startedAt;
        const remaining = Math.max(0, minimumDisplayTime - elapsed);

        window.setTimeout(() => {
          splash.classList.add("is-leaving");
          window.setTimeout(() => {
            splash.remove();
            if (siteContent) siteContent.removeAttribute("aria-hidden");
          }, fadeDuration);
        }, remaining);
      }

      if (document.readyState === "complete") {
        dismissSplash();
      } else {
        window.addEventListener("load", dismissSplash, { once: true });
      }

      // Safety fallback: the splash will not stay forever if a resource never finishes loading.
      window.setTimeout(dismissSplash, 7000);
    })();
  </script>
</body>
</html>
